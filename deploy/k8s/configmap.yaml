apiVersion: v1
kind: ConfigMap
metadata:
  name: openrtc-config
  namespace: openrtc
data:
  OPENRTC_MODE: "cluster"
  OPENRTC_SERVER_HOST: "0.0.0.0"
  OPENRTC_SERVER_PORT: "8080"
  OPENRTC_WS_PATH: "/ws"
  OPENRTC_ALLOWED_ORIGINS: "https://app.example.com"
  OPENRTC_TENANT_ENFORCE_PREFIX: "true"
  OPENRTC_TENANT_SEPARATOR: ":"
  OPENRTC_LIMIT_PAYLOAD_MAX_BYTES: "16384"
  OPENRTC_LIMIT_ENVELOPE_MAX_BYTES: "20480"
  OPENRTC_LIMIT_YJS_MAX_BYTES: "1048576"
  OPENRTC_LIMIT_ROOMS_PER_CONNECTION: "50"
  OPENRTC_LIMIT_EMITS_PER_SECOND: "100"
  OPENRTC_LIMIT_OUTBOUND_QUEUE_DEPTH: "256"
  OPENRTC_YJS_COMPACTOR_INTERVAL_MS: "60000"
  OPENRTC_YJS_COMPACTOR_MIN_UPDATES: "500"
  OPENRTC_YJS_COMPACTOR_MIN_BYTES: "1048576"
  OPENRTC_YJS_COMPACTOR_ROOM_RETRIES: "2"
  OPENRTC_YJS_COMPACTOR_RETRY_BACKOFF_MS: "1000"
  OPENRTC_YJS_COMPACTOR_MAX_CONSECUTIVE_FAILURES: "10"
  OPENRTC_YJS_COMPACTOR_METRICS_HOST: "0.0.0.0"
  OPENRTC_YJS_COMPACTOR_METRICS_PORT: "9102"
---
apiVersion: v1
kind: Secret
metadata:
  name: openrtc-auth
  namespace: openrtc
type: Opaque
stringData:
  # Replace these with your actual OIDC provider and Redis secret values.
  # Keep OPENRTC_REDIS_URL in a Secret because it contains the Redis password.
  REDIS_PASSWORD: "replace-with-redis-password"
  OPENRTC_REDIS_URL: "redis://:replace-with-redis-password@redis.openrtc.svc.cluster.local:6379/0"
  OPENRTC_AUTH_ISSUER: "https://your-issuer.example.com"
  OPENRTC_AUTH_AUDIENCE: "openrtc-clients"
  OPENRTC_AUTH_JWKS_URL: "https://your-issuer.example.com/.well-known/jwks.json"
  OPENRTC_ADMIN_AUTH_ISSUER: "https://your-issuer.example.com"
  OPENRTC_ADMIN_AUTH_AUDIENCE: "openrtc-admin"
  OPENRTC_ADMIN_AUTH_JWKS_URL: "https://your-issuer.example.com/.well-known/jwks.json"
